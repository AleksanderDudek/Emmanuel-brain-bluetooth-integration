# Builds, tests and deploys the web app (web/) to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # HolyHolyHoly 3D: the built libraries and content.json are current, the GDevelop project is valid
      - run: npm run game3d:check
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # headless Chrome (preinstalled on the runner) plays a chapter of the exported game
      - run: npm run game3d:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holyholyholy3d-smoke
          path: web/game3d/.smoke
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
